name: Test & Release

on:
  push:
    branches: [ "master" ]

permissions:
  contents: write       # ← PERMISSÃO PARA CRIAR RELEASE

env:
  CARGO_TERM_COLOR: always

jobs:
  # ═══════════════════════════════════
  #  JOB 1: TESTES
  # ═══════════════════════════════════
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

  # ═══════════════════════════════════
  #  JOB 2: RELEASE (só se testes passarem)
  # ═══════════════════════════════════
  release:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write   # ← reforça a permissão no job também
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release --verbose
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"

      # ← DEBUG: lista o que foi gerado
      - name: List build output
        shell: bash
        run: |
          echo "=== Conteúdo de target/release/ ==="
          ls -la target/release/*.exe 2>/dev/null || echo "NENHUM .exe encontrado!"

      # ← Lê a versão do Cargo.toml
      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Versão: $VERSION"

      # ← Cria a release
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            target/release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
