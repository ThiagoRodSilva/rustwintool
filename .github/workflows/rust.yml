name: Test & Release

on:
  push:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ═══════════════════════════════════════
  #  JOB 1: BUILD + TESTES
  # ═══════════════════════════════════════
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

  # ═══════════════════════════════════════
  #  JOB 2: RELEASE (só roda se testes passarem)
  # ═══════════════════════════════════════
  release:
    needs: test                          # ← SÓ RODA SE "test" PASSAR
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Compila em modo release com linkagem estática
      - name: Build release binary
        run: cargo build --release --verbose
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"

      # Lê a versão do Cargo.toml automaticamente
      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Versão detectada: $VERSION"

      # Cria a release + sobe o .exe
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            target/release/rustwintool.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
